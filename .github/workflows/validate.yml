name: Validate Omarchy Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq imagemagick

      - name: Run Test Suite
        run: |
          chmod +x ./tests/test_plugin.sh
          ./tests/test_plugin.sh
